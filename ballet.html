function lnGammaIm(re, im) {
  let si = 0; const N = 10;

  const zr = re + N, zi = im, lr = 0.5 * Math.log(zr * zr + zi * zi), li = Math.atan2(zi, zr);
  let ri = (zr - 0.5) * li + zi * lr - zi;

  let pr = ir, pi = ii;
  for (const c of [1 / 12, -1 / 360, 1 / 1260, -1 / 1680, 1 / 1188]) { ri += c * pi; const n = pr * i2r - pi * i2i; pi = pr * i2i + pi * i2r; pr = n; }
  return ri - si;

function zetaHalf(t) {
  const sr = 0.5, si = t, N = 30;
  let re = 0, im = 0;
  for (let n = 1; n < N; n++) { const l = Math.log(n), m = Math.exp(-sr * l); re += m * Math.cos(si * l); im -= m * Math.sin(si * l); }

}

      if (!ln.final) {

      const st = { color: CREAM, solColor: GOLD, solA: 0, time, solRects: null, solPulse: 0 };

        ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = fade * 0.9;
        const s = F * 1.4; ctx.drawImage(glowOf('#FFB77A'), px - s / 2, py - s / 2, s, s);

/* ════════════════════════════ the complex plane ══════════════════════════════ */

  g.addColorStop(0, 'rgba(217,119,87,0.0)'); g.addColorStop(0.5, 'rgba(255,214,170,0.05)'); g.addColorStop(1, 'rgba(217,119,87,0.0)');
  ctx.fillStyle = g; ctx.fillRect(cx - sh, 0, sh * 2, H);
  ctx.save();
  ctx.strokeStyle = 'rgba(239,230,214,0.16)'; ctx.lineWidth = 1; ctx.setLineDash([3, 7]);
  ctx.beginPath(); ctx.moveTo(cx - sh, 0); ctx.lineTo(cx - sh, H); ctx.moveTo(cx + sh, 0); ctx.lineTo(cx + sh, H); ctx.stroke();
  ctx.restore();

  ctx.font = `${(F * 0.36).toFixed(1)}px ${MONO}`; ctx.textAlign = 'right';
  for (let t = Math.ceil(tBot / 10) * 10; t <= tTop; t += 10) {

    ctx.font = `${(F * 0.5).toFixed(1)}px ${MF}`; ctx.fillStyle = 'rgba(239,230,214,0.55)'; ctx.textAlign = 'center';
    ctx.fillText('0', cx - sh, y0 + F * 0.75); pill('½', cx, y0 + F * 0.75, F * 0.5); ctx.fillStyle = 'rgba(239,230,214,0.55)';
    ctx.fillText('½', cx, y0 + F * 0.75); ctx.fillText('1', cx + sh, y0 + F * 0.75);
    ctx.font = `${(F * 0.42).toFixed(1)}px ${MF}`; ctx.fillStyle = 'rgba(239,230,214,0.35)';
    ctx.fillText('×', cx + sh, y0 + F * 0.15);

    ctx.textAlign = 'left';

    ctx.fillStyle = 'rgba(217,119,87,0.07)'; ctx.fill();
    ctx.globalCompositeOperation = 'lighter';
    pathZ(lo, mid); ctx.strokeStyle = 'rgba(217,119,87,0.22)'; ctx.lineWidth = 5; ctx.stroke();
    ctx.strokeStyle = 'rgba(255,190,150,0.75)'; ctx.lineWidth = 1.3; ctx.stroke();
    ctx.restore();

  if (hi > mid) { pathZ(mid, hi); ctx.strokeStyle = 'rgba(239,230,214,0.16)'; ctx.lineWidth = 1; ctx.setLineDash([2, 5]); ctx.stroke(); ctx.setLineDash([]); }

  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = 'rgba(255,214,170,0.07)'; ctx.fillRect(cx - 5, 0, 10, H);
  ctx.fillStyle = 'rgba(255,226,196,0.10)'; ctx.fillRect(cx - 2, 0, 4, H);
  ctx.restore();
  ctx.fillStyle = 'rgba(255,240,222,0.8)'; ctx.fillRect(cx - 0.75, 0, 1.5, H);
  // labels at the top
  ctx.textAlign = 'center';
  ctx.font = `${(F * 0.5).toFixed(1)}px ${MF}`;
  pill('Re(𝑠) = ½', cx, H * 0.04, F * 0.5);
  ctx.fillStyle = 'rgba(239,230,214,0.6)';
  ctx.fillText('Re(𝑠) = ½', cx, H * 0.04);
  ctx.font = `${(F * 0.38).toFixed(1)}px ${MF}`; ctx.fillStyle = 'rgba(239,230,214,0.3)';
  ctx.fillText('Re(𝑠) = 0', cx - sh, H * 0.04); ctx.fillText('Re(𝑠) = 1', cx + sh, H * 0.04);
  ctx.textAlign = 'left';

    ctx.beginPath(); ctx.arc(cx, y, lit ? 2.6 : 2, 0, TAU); ctx.fill();
    ctx.font = `${(F * 0.36).toFixed(1)}px ${MONO}`; ctx.fillStyle = lit ? 'rgba(255,214,160,0.75)' : 'rgba(239,230,214,0.22)';

// a dark backing so labels sitting on the critical line stay legible (uses the current ctx.font)

  const w = ctx.measureText(text).width + sz * 0.8, h = sz * 1.25;
  ctx.save(); ctx.fillStyle = 'rgba(10,9,17,0.82)';

function drawFinishRibbon(tau, cam, time) {

  if (y < -F * 4 || y > H + F * 4) return;
  const x0 = cx - sh * 1.12, x1 = cx + sh * 1.12;
  const broken = tau >= BREAK_T && tau >= FINAL_FLY.t0, since = tau - BREAK_T;

/* ════════════════════════════ Clawd ══════════════════════════════════════════
   Body/eye/arm/leg proportions follow Clawd's banner pixel grid (12×8 body,
   1×2 eyes, 2×2 arms, 1×2 legs). The body is treated as a 12×6.4×8 box so it can
   genuinely turn in a pirouette; the tutu is my addition.                        */
function drawClawd(X, Y, P, time) {
  const u = G.u;
  ctx.save();
  ctx.translate(X, Y);
  // glow
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.22 * P.glow;
  const gs = u * 30 * (0.8 + 0.2 * P.glow); ctx.drawImage(glowOf('#E8875F'), -gs / 2, -u * 7 - gs / 2, gs, gs); ctx.restore();

  const tutuPath = (front) => {
    ctx.beginPath();
    const N = 48, a0 = front ? 0 : Math.PI, a1 = front ? Math.PI : TAU;
    for (let i = 0; i <= N; i++) {
      const th = a0 + (a1 - a0) * i / N, r = 1 + 0.075 * Math.cos(14 * th - phase);
      const x = Math.cos(th) * rx * r, y = tutuY + Math.sin(th) * ry * r;
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    for (let i = N; i >= 0; i--) { const th = a0 + (a1 - a0) * i / N; ctx.lineTo(Math.cos(th) * 6.4, tutuY - 0.5 + Math.sin(th) * 0.9); }
    ctx.closePath();
  };
  // legs
  ctx.fillStyle = ORANGE;
  const lw = Math.abs(cf) + Math.abs(sf) * 0.9;
  for (let i = 0; i < 4; i++) {
    const L = P.legs[i];
    ctx.save(); ctx.translate(LEGX[i] * cf, yb - 0.3); ctx.rotate(-L.ang);
    ctx.fillRect(-lw / 2, 0, lw, 2 * L.len + 0.3); ctx.restore();

    const ang = sgn > 0 ? -alpha : alpha, ca = Math.cos(ang), sa = Math.sin(ang);
    const len = 2.1 + 0.7 * sat(alpha / 1.3);
    const sxp = sgn * A, syp = yb - 3, pts = [[0, -1], [len, -1], [len, 1], [0, 1]].map(([px, py]) => {
      const ox = sgn * px * ca - py * sa, oy = sgn * px * sa + py * ca;
      return [(sxp + ox) * cf, syp + oy];
    });
    ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath(); ctx.fill();
    if (Math.abs(sf) > 0.05) {            // seen end-on during a turn
      const mx = (pts[0][0] + pts[2][0]) / 2, my = (pts[0][1] + pts[2][1]) / 2;
      ctx.fillRect(mx - Math.abs(sf), my - 1, 2 * Math.abs(sf), 2);
    }

  if (sf > 0) face(-A * cf - B * sf, -A * cf + B * sf, ORANGE_SIDE);
  if (sf < 0) face(A * cf - B * sf, A * cf + B * sf, ORANGE_SIDE);
  if (cf < 0) face(A * cf - B * sf, -A * cf - B * sf, ORANGE_BACK);
  if (cf > 0) {
    face(-A * cf + B * sf, A * cf + B * sf, ORANGE);
    ctx.fillStyle = EYE;

    for (const ex of [-3.5, 3.5]) {

      ctx.fillRect(xx - 0.5 * cf, ey, cf, eh);
    }
  }
  ctx.fillStyle = ORANGE;
  if (!armBehind(1)) arm(1, P.armR);
  if (!armBehind(-1)) arm(-1, P.armL);

  tutuPath(true);
  const tg = ctx.createLinearGradient(0, tutuY - 1, 0, tutuY + ry * 1.2);
  tg.addColorStop(0, 'rgba(255,240,246,0.82)'); tg.addColorStop(1, 'rgba(255,184,208,0.55)');
  ctx.fillStyle = tg; ctx.fill();
  ctx.strokeStyle = 'rgba(255,250,252,0.9)'; ctx.lineWidth = 0.25; ctx.stroke();
  // a second, shorter ruffle layer
  ctx.save(); ctx.translate(0, -0.35); ctx.scale(0.86, 0.8); ctx.translate(0, tutuY * 0.25);
  tutuPath(true); ctx.fillStyle = 'rgba(255,250,252,0.35)'; ctx.fill(); ctx.restore();
  ctx.restore();
  // glints on the tutu hem
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 7; i++) {
    const th = (i / 7) * Math.PI + 0.2 + phase * 0.05, tw = 0.5 + 0.5 * Math.sin(time * 7 + i * 2.3);
    const lx = Math.cos(th) * rx * u, ly = (tutuY + Math.sin(th) * ry) * u * P.sy;
    const rot = P.tilt, px = X + lx * Math.cos(rot) - ly * Math.sin(rot), py = Y + lx * Math.sin(rot) + ly * Math.cos(rot);
    const s = u * 2.2 * tw; ctx.globalAlpha = 0.8 * tw;
    ctx.drawImage(sparkSprite('#FFFFFF'), px - s / 2, py - s / 2, s, s);
  }
  ctx.restore();
}
function drawPirouetteRing(X, Y, P, front, time) {
  if (P.phase !== 'dance' && P.phase !== 'finale') return;
  const a = P.phase === 'finale' ? 1 : hold(P.u, 0.1, 0.92, 0.12);
  if (a <= 0) return;

  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < n; i++) {
    const th = P.spin * 1.5 + i * TAU / n + time * 0.5, z = Math.sin(th);
    if ((z > 0) !== front) continue;
    const px = X + Math.cos(th) * u * 12, py = cyy + z * u * 3.2 + Math.sin(time * 3 + i) * u * 0.6;
    const s = u * (2.4 + 1.6 * (z + 1) / 2) * (0.75 + 0.25 * Math.sin(time * 11 + i * 3));
    ctx.globalAlpha = a * (0.5 + 0.5 * (z + 1) / 2);
    ctx.drawImage(sparkSprite(SPARK_COLORS[i % SPARK_COLORS.length]), px - s / 2, py - s / 2, s, s);
  }
  ctx.restore();
}

/* ════════════════════════════ particles ══════════════════════════════════════ */

const prng = rng(12345);
const pick = arr => arr[Math.floor(prng() * arr.length)];
function emitWorld(x, t, n, speed, opts = {}) {
  for (let i = 0; i < n; i++) {
    const a = opts.ang != null ? opts.ang + (prng() - 0.5) * (opts.spread || 1) : prng() * TAU;
    const sp = speed * (0.35 + prng() * 0.65);
    worldP.push({ x: x + (prng() - 0.5) * (opts.jx || 0), t: t + (prng() - 0.5) * (opts.jt || 0),
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0, max: (opts.life || 1.2) * (0.6 + prng() * 0.7),
      s: (opts.size || 1) * G.u * (1.2 + prng() * 2.2), col: pick(opts.cols || SPARK_COLORS), rot: prng() * TAU, ph: prng() * TAU, g: opts.g != null ? opts.g : 30 });
  }
}
function emitStream(n, cardN, from) {
  for (let i = 0; i < n; i++) {
    streams.push({ cardN, x0: from.x + (prng() - 0.5) * G.u * 6, y0: from.y + (prng() - 0.5) * G.u * 5, delay: prng() * 0.32,
      dur: 0.5 + prng() * 0.4, age: 0, bend: (prng() - 0.5) * 0.9 + (cardN % 2 ? 0.25 : -0.25), tx: prng(), ty: prng(),
      col: pick(['#FFE2A8', '#FFC97A', '#FFF6E2', '#FFB7CA']), s: G.u * (1.6 + prng() * 1.6), last: null });
  }
}
function popScreen(x, y, n, spd) {
  for (let i = 0; i < n; i++) { const a = prng() * TAU, s = spd * (0.3 + prng() * 0.7);
    screenP.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0, max: 0.4 + prng() * 0.5, s: G.u * (1 + prng() * 1.6), col: pick(SPARK_COLORS) }); }
}
function updateParticles(dt, clawdScreen) {
  const scale = G.scale;
  for (const p of worldP) { p.life += dt; p.vx *= Math.exp(-1.6 * dt); p.vy = p.vy * Math.exp(-1.6 * dt) + p.g * dt; p.x += p.vx * dt; p.t -= p.vy * dt / scale; }

  screenP = screenP.filter(p => p.life < p.max);

    s.age += dt;

    }

}
function targetPoint(s) {
  const rs = solTargets[s.cardN];
  if (!rs || !rs.length) return null;
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const r of rs) { x0 = Math.min(x0, r.x0); y0 = Math.min(y0, r.y0); x1 = Math.max(x1, r.x1); y1 = Math.max(y1, r.y1); }

}
function drawParticles(cam, time) {
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const p of worldP) {
    const k = p.life / p.max, a = (1 - k) * (0.65 + 0.35 * Math.sin(time * 18 + p.ph));

    if (y < -20 || y > H + 20) continue;
    ctx.globalAlpha = clamp(a, 0, 1);
    ctx.drawImage(sparkSprite(p.col), x - s / 2, y - s / 2, s, s);
  }
  for (const p of screenP) {
    const k = p.life / p.max; ctx.globalAlpha = 1 - k; const s = p.s * (1 - 0.4 * k);
    ctx.drawImage(sparkSprite(p.col), p.x - s / 2, p.y - s / 2, s, s);
  }
  for (const s of streams) {
    const q = (s.age - s.delay) / s.dur; if (q <= 0) continue;
    const tp = targetPoint(s); if (!tp) continue;
    const e = easeInOut3(q), mx = (s.x0 + tp.x) / 2, my = (s.y0 + tp.y) / 2;
    const dx = tp.x - s.x0, dy = tp.y - s.y0, cxp = mx - dy * s.bend, cyp = my + dx * s.bend - Math.abs(dx) * 0.25;
    const bz = (t) => [(1 - t) * (1 - t) * s.x0 + 2 * (1 - t) * t * cxp + t * t * tp.x, (1 - t) * (1 - t) * s.y0 + 2 * (1 - t) * t * cyp + t * t * tp.y];
    for (let j = 4; j >= 0; j--) {
      const [x, y] = bz(Math.max(0, e - j * 0.035));
      const sz = s.s * (1 - j * 0.16); ctx.globalAlpha = (1 - j * 0.2) * 0.9;
      ctx.drawImage(sparkSprite(s.col), x - sz / 2, y - sz / 2, sz, sz);
    }
  }
  ctx.restore();
}

/* ════════════════════════════ events ═════════════════════════════════════════ */
const EVENTS = [];
for (let k = 1; k <= 20; k++) { EVENTS.push({ t: landTime(k), type: 'land', k }); EVENTS.push({ t: sparkleTime(k), type: 'sparkle', k }); }
EVENTS.push({ t: BREAK_T, type: 'break' }, { t: FINALE.t0, type: 'finale' });
let lastClawd = { x: 0, y: 0, t: 0, px: 0 };
function fire(ev) {
  const P = poseAt(ev.t + 1e-4), u = G.u;
  if (ev.type === 'land') emitWorld(P.x * G.sh, P.t, 16, G.u * 22, { ang: -Math.PI / 2, spread: 2.6, life: 0.9, g: 60 });
  if (ev.type === 'sparkle') {
    const hero = CARDS[ev.k - 1].hero;
    emitWorld(P.x * G.sh, P.t + 6 * u / G.scale, hero ? 70 : 34, u * (hero ? 46 : 32), { life: hero ? 1.6 : 1.2, g: 25 });
    emitStream(hero ? 44 : 26, ev.k, { x: lastClawd.x + (ev.k % 2 ? -1 : 1) * u * 6, y: lastClawd.y - u * 8 });
  }
  if (ev.type === 'break') emitWorld(0, FINISH_T, 60, u * 40, { life: 1.4, jx: G.sh * 1.6, g: 40 });
  if (ev.type === 'finale') emitWorld(P.x * G.sh, P.t + 6 * u / G.scale, 160, u * 70, { life: 2.2, size: 1.3, g: 18 });
}

/* ════════════════════════════ main loop ══════════════════════════════════════ */
let clock = 0, paused = false, prevTau = 0, last = performance.now();
let recorder = null, recState = 'idle', recChunks = [];
function onWrap() {
  worldP = []; streams = [];
  if (recState === 'armed') startRecording();
  else if (recState === 'recording') stopRecording();
}
function step(dt) {
  const t0 = prevTau;
  clock += dt;
  const tau = clock % LOOP;
  const wrapped = tau < t0;
  for (const ev of EVENTS) {
    if (!wrapped ? (ev.t > t0 && ev.t <= tau) : (ev.t > t0 || ev.t <= tau)) fire(ev);
  }
  if (wrapped) onWrap();
  prevTau = tau;
  const P = poseAt(tau);
  // continuous emissions
  if (P.phase === 'fly' || P.phase === 'finale') {
    const n = Math.floor(dt * 80 + prng());
    emitWorld(P.x * G.sh, P.t + 1 * G.u / G.scale, n, G.u * 8, { life: 1.3, jx: G.u * 10, jt: 3 * G.u / G.scale, g: 8, size: 0.85 });
  } else if (P.phase === 'dance' && prng() < dt * 22) {
    emitWorld(P.x * G.sh, P.t + 2 * G.u / G.scale, 1, G.u * 12, { life: 0.9, jx: G.u * 16, g: -10, size: 0.8 });
  }
  updateParticles(dt);
}

function render(time) {
  const tau = clock % LOOP;
  const P = poseAt(tau), cam = camAt(tau);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.drawImage(bgCanvas, 0, 0, W, H);
  // stars
  for (const s of stars) {
    const y = ((s.y + cam * G.scale * s.depth) % (H * 1.3)) - H * 0.15;
    const a = 0.25 + 0.35 * (0.5 + 0.5 * Math.sin(time * s.sp + s.ph));
    ctx.fillStyle = s.warm ? `rgba(255,214,180,${a})` : `rgba(220,220,255,${a})`;
    ctx.fillRect(s.x, y, s.s, s.s);
  }
  drawQuote(P, time);
  drawPlane(tau, cam, P);
  drawFinishRibbon(tau, cam, time);
  drawCards(tau, time);
  // Clawd
  const bob = (P.phase === 'dance' || P.phase === 'sparkle') ? Math.sin(time * 5) * G.u * 0.25 : 0;
  const X = G.cx + P.x * G.sh, Y = worldY(P.t, cam) + bob;
  lastClawd = { x: X, y: Y };
  drawPirouetteRing(X, Y, P, false, time);
  drawClawd(X, Y, P, time);
  drawPirouetteRing(X, Y, P, true, time);
  drawParticles(cam, time);
  drawReadout(P, tau);
  drawBloom(tau, X, Y);
}

function drawQuote(P, time) {
  const key = phaseWord(P);
  ctx.save(); ctx.font = quote.font; ctx.textBaseline = 'alphabetic';
  for (const w of quote.words) {
    const target = w.key === key ? 1 : 0;
    wordGlow[w.w] = lerp(wordGlow[w.w] || 0, target, target ? 0.12 : 0.05);
    const g = wordGlow[w.w];
    ctx.globalAlpha = 0.062 + 0.15 * g;
    ctx.fillStyle = g > 0.02 ? `rgb(${Math.round(lerp(239, 255, g))},${Math.round(lerp(230, 196, g))},${Math.round(lerp(214, 130, g))})` : CREAM;
    if (g > 0.05) { ctx.shadowColor = 'rgba(255,160,90,0.8)'; ctx.shadowBlur = quote.qs * 0.35 * g; } else ctx.shadowBlur = 0;
    ctx.fillText(w.w, w.x, w.y);
  }
  ctx.restore();
}

function drawReadout(P, tau) {
  const { F, cx } = G;
  ctx.save(); ctx.textAlign = 'center';
  ctx.font = `${(F * 0.46).toFixed(1)}px ${MONO}`;
  ctx.fillStyle = 'rgba(239,230,214,0.55)';
  const y = H - F * 0.9, rd = `s = ½ + ${P.t.toFixed(4)}i`;
  pill(rd, cx, y, F * 0.46); ctx.fillStyle = 'rgba(239,230,214,0.6)';
  ctx.fillText(rd, cx, y);
  const onZero = P.phase === 'dance' || P.phase === 'sparkle' || P.phase === 'finale';
  if (onZero) {
    const since = tau - P.seg.t0 + (P.phase === 'sparkle' ? 1.5 : 0);
    ctx.globalAlpha = smooth(since / 0.3) * (P.phase === 'sparkle' ? 1 - smooth((P.u - 0.75) / 0.25) : 1);
    ctx.font = `${(F * 0.5).toFixed(1)}px ${MF}`; pill('𝜁(𝑠) = 0', cx, y - F * 0.75, F * 0.5);
    ctx.fillStyle = GOLD; ctx.fillText('𝜁(𝑠) = 0', cx, y - F * 0.75);
  }
  ctx.restore();
}

function drawBloom(tau, X, Y) {
  let a = 0, r = 0, full = false;
  const start = FINALE.t0 + 0.45, end = LOOP;
  if (tau >= start) { const q = (tau - start) / (end - start); r = easeInOut3(q) * Math.hypot(W, H) * 1.15; a = 0.95; }
  if (tau < 1.5) { full = true; a = 0.95 * (1 - smooth(tau / 1.5)); }
  if (a <= 0.001) return;
  ctx.save();
  if (full) {
    const g = ctx.createRadialGradient(W / 2, G.yA - G.u * 8, 0, W / 2, G.yA, Math.hypot(W, H) * 0.7);
    g.addColorStop(0, `rgba(255,246,228,${a})`); g.addColorStop(0.6, `rgba(255,214,170,${a})`); g.addColorStop(1, `rgba(240,170,130,${a})`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  } else if (r > 1) {
    const g = ctx.createRadialGradient(X, Y - G.u * 8, 0, X, Y - G.u * 8, r);
    g.addColorStop(0, `rgba(255,246,228,${a})`); g.addColorStop(0.55, `rgba(255,214,170,${a})`);
    g.addColorStop(0.85, `rgba(240,170,130,${a * 0.7})`); g.addColorStop(1, 'rgba(240,170,130,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  ctx.restore();
}

function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!paused) step(dt);
  render(clock);
  requestAnimationFrame(frame);
}

/* ════════════════════════════ recording & keys ═══════════════════════════════ */
let hudTimer = 0;
function say(msg, ms = 3500) { hud.textContent = msg; hud.classList.add('on'); clearTimeout(hudTimer); if (ms) hudTimer = setTimeout(() => hud.classList.remove('on'), ms); }
function startRecording() {
  const mime = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'].find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m));
  if (!mime) { say('MediaRecorder is not available in this browser'); recState = 'idle'; return; }
  recChunks = [];
  recorder = new MediaRecorder(cv.captureStream(60), { mimeType: mime, videoBitsPerSecond: 16e6 });
  recorder.ondataavailable = e => e.data.size && recChunks.push(e.data);
  recorder.onstop = () => {
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(recChunks, { type: 'video/webm' }));
    a.download = `clawd-critical-line-${W}x${H}.webm`; a.click(); say('saved one loop ✓');
  };
  recorder.start(500); recState = 'recording'; say(`● recording one loop (${LOOP.toFixed(1)} s)…`, 0);
}
function stopRecording() { recState = 'idle'; recorder && recorder.stop(); }
addEventListener('keydown', e => {
  if (e.key === ' ') { paused = !paused; say(paused ? 'paused' : 'playing', 1200); e.preventDefault(); }
  else if (e.key === 'r' || e.key === 'R') {
    if (recState === 'idle') { recState = 'armed'; say('recording armed — it starts at the top of the loop', 0); }
    else if (recState === 'armed') { recState = 'idle'; say('recording cancelled', 1500); }
  }
  else if (e.key === 'f' || e.key === 'F') { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }
  else if (e.key === 'h' || e.key === 'H') say('space  pause\nR      record one seamless loop (.webm)\nF      fullscreen\n?size=1920x1080 in the URL fixes the resolution', 6000);
});
addEventListener('resize', () => { if (!fixed) resize(); });

// debug/testing hook
window.clawd = { seek(t) { clock = t; prevTau = t % LOOP; worldP = []; streams = []; }, get loop() { return LOOP; }, pause(p = true) { paused = p; }, get tau() { return clock % LOOP; } };

/* ════════════════════════════ start ══════════════════════════════════════════ */
const allText = CARDS.map(c => c.title + c.stages.map(s => s.tex).join('')).join('');
Promise.race([
  Promise.all([
    document.fonts.load(`italic 500 40px "Cormorant Garamond"`, 'Claude flew'),
    document.fonts.load(`40px "Latin Modern Math"`, '𝑥∑'),
  ]).catch(() => {}),
  new Promise(r => setTimeout(r, 2500)),
]).then(() => {
  resize();
  say('space pause · R record one loop · F fullscreen · H help', 5000);
  requestAnimationFrame(t => { last = t; frame(t); });
  document.fonts.addEventListener && document.fonts.addEventListener('loadingdone', () => { metricCache = new Map(); resize(); });
});
})();
</script>
</body>
